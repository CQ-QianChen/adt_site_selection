[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nuctrans_fastuq"
version = "0.1.0"
description = "Surrogate models and uncertainty quantification for 1D nuclide transport (OGS) simulations."
requires-python = ">=3.10"
dependencies = [
    # vendored BayesValidRox (nuctrans_fastuq/bayesvalidrox)
    "numpy>=2.0.0",
    "scipy",
    "scikit-learn>=1.8.0",
    "joblib>=1.5.3",
    "multiprocess>=0.70.19",
    "pandas",
    "matplotlib",
    "seaborn>=0.13.2",
    "tqdm",
    "corner>=2.2.3",
    "emcee>=3.1.6",
    "chaospy>=4.3.21",
    "umbridge>=1.2.4",
    # engine file and the rest
    "h5py",
    "pyyaml",
]

[project.optional-dependencies]
# Gaussian process surrogates (gpe_torch)
gp = [
    "gpytorch>=1.15.2",
    "torch>=2.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nuctrans_fastuq.bayesvalidrox" = ["*.mplstyle"]
