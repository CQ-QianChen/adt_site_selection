name: Module images

# Builds the image of every module from <module>/Dockerfile and pushes it to
# ghcr.io/<repo>/<module>, tagged main and with the commit, for --containerized runs.
# Each platform is built on a native runner and pushed by digest; the merge job puts
# the platforms of a module into one tag. A module has an arm64 image when its
# conda-lock.yml has linux-aarch64 (communication_sdh and model do not).

on:
  push:
    branches: [main]
    paths:
      - '*/Dockerfile'
      - '*/conda-lock.yml'
      - '.github/workflows/images.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {module: communication_ntd, platform: linux/amd64, runner: ubuntu-latest}
          - {module: communication_ntd, platform: linux/arm64, runner: ubuntu-24.04-arm}
          - {module: communication_sdh, platform: linux/amd64, runner: ubuntu-latest}
          - {module: decision_support_analysis, platform: linux/amd64, runner: ubuntu-latest}
          - {module: decision_support_analysis, platform: linux/arm64, runner: ubuntu-24.04-arm}
          - {module: decision_support_report, platform: linux/amd64, runner: ubuntu-latest}
          - {module: decision_support_report, platform: linux/arm64, runner: ubuntu-24.04-arm}
          - {module: decision_support_uq, platform: linux/amd64, runner: ubuntu-latest}
          - {module: decision_support_uq, platform: linux/arm64, runner: ubuntu-24.04-arm}
          - {module: model, platform: linux/amd64, runner: ubuntu-latest}
          - {module: sampling, platform: linux/amd64, runner: ubuntu-latest}
          - {module: sampling, platform: linux/arm64, runner: ubuntu-24.04-arm}
          - {module: surrogate, platform: linux/amd64, runner: ubuntu-latest}
          - {module: surrogate, platform: linux/arm64, runner: ubuntu-24.04-arm}
    steps:
      - name: Image name (lowercase, as ghcr.io requires)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.module }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.module }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Save the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.module }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - communication_ntd
          - communication_sdh
          - decision_support_analysis
          - decision_support_report
          - decision_support_uq
          - model
          - sampling
          - surrogate
    steps:
      - name: Image name (lowercase, as ghcr.io requires)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.module }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.module }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Push the tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
