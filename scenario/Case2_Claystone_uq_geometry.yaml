communication_sdh:
  site_name: DE_North_Claystone

  tag_dict:
    location:
      - Lower-Saxony

  # optional
  merge_unit_rock_prop:
    Quaternary: [Quaternary]
    Albian: [Albian]
    Aptian: [Aptian]
    Host_rock: [Barremian, Hauterivian]
    Valanginian_Wealden: [Valanginian, Wealden]
    Jurassic_Upper: [Jurassic_Upper]
    Jurassic_Middle: [Jurassic_Middle]
    Jurassic_Lower: [Jurassic_Lower]
    Keuper: [Keuper]
    Buntsandstein_Muschelkalk: [Buntsandstein_Muschelkalk, Muschelkalk]
    Zechstein: [Zechstein]
    basement: [Zechstein]

  # optional
  merge_unit_depth:
    Quaternary_top:
      value: 0.0
      value_min: -10.0
      value_max: 10.0
      sampling_function: generate_uniform
    Quaternary_bottom:
      value: -50.0
      value_min: -60.0
      value_max: -40.0
      sampling_function: generate_uniform
    Albian_bottom:
      value: -100.0
      value_min: -110.0
      value_max: -90.0
      sampling_function: generate_uniform
    Aptian_bottom:
      value: -400.0
      value_min: -415.0
      value_max: -385.0
      sampling_function: generate_uniform
    Host_rock_bottom:
      value: -525.0
      value_min: -535.0
      value_max: -510.0
      sampling_function: generate_uniform
    Valanginian_Wealden_bottom:
      value: -650.0
      value_min: -675.0
      value_max: -625.0
      sampling_function: generate_uniform
    Jurassic_Upper_bottom:
      value: -800.0
      value_min: -825.0
      value_max: -775.0
      sampling_function: generate_uniform
    Jurassic_Middle_bottom:
      value: -900.0
      value_min: -925.0
      value_max: -875.0
      sampling_function: generate_uniform
    Jurassic_Lower_bottom:
      value: -1000.0
      value_min: -1025.0
      value_max: -975.0
      sampling_function: generate_uniform
    Keuper_bottom:
      value: -1100.0
      value_min: -1125.0
      value_max: -1100.0
      sampling_function: generate_uniform
    Buntsandstein_Muschelkalk_bottom:
      value: -1500.0
      value_min: -1525.0
      value_max: -1475.0
      sampling_function: generate_uniform
    Zechstein_bottom:
      value: -1600.0
      value_min: -1625.0
      value_max: -1575.0
      sampling_function: generate_uniform
    basement_bottom:
      value: -1800.0
      value_min: -1900.0
      value_max: -1700.0
      sampling_function: generate_uniform

communication_ntd:
  nuclide_to_consider:
    - I-129

uncertain_parameters:
  geometry:
    rock_interface:
      - Aptian_bottom
      - Host_rock_bottom

sampling_config:
  training:
    sample_size: 4
    sampling_method: sobol
    seed: 21
  validation:
    sample_size: 4
    sampling_method: random
    seed: 21

model:
  create_python_bc: True
  python_bc_source_value: 0.0022
  source:
    type: point
    loc: -462.5
  initial_condition_nuclide:
    type:
      - Constant
    value:
      - 0.0
  boundary_condition_nuclide:
    type:
      - Python
    mesh:
      - reactive_domain
    value:
      - bc_c
  pressure_setup:
    pressure_initial: 100000.0
    pressure_top: 100000.0
    pressure_bottom: 1000000.0
  decay: true
  diffusion: true
  advection: false
  sorption: true

simulator_config:
  n_jobs: 4
  parallel: True
  keep_vtu: False

surrogate:
  type: pce
  output_qoi: I-129Flux
  z_interest:
    - Host_rock_top
    - Host_rock_bottom
  t_interest: null
  qoi_floor: 1.0e-20
  transform: null
  pce_opts:
    q_norm: 1.0
    degree: [3, 5, 6]
