communication_sdh:
  site_name: DE_Crystalline

  tag_dict:
    location:
      - Baden-Wuerttemberg

  # optional
  merge_unit_rock_prop:
    Quaternary: [Quaternary]
    Muschelkalk: [Muschelkalk]
    Buntsandstein: [Buntsandstein]
    Zechstein: [Zechstein_Rocksalt, Zechstein_Potash, Zechstein_Anhydrite]
    Host_rock: [Granite]
    basement: [Granite]

  # optional
  merge_unit_depth:
    Quaternary_top:
      value: 0.0
      value_min: -10.0
      value_max: 10.0
      sampling_function: generate_uniform
    Quaternary_bottom:
      value: -50.0
      value_min: -60.0
      value_max: -40.0
      sampling_function: generate_uniform
    Muschelkalk_bottom:
      value: -100.0
      value_min: -110.0
      value_max: -90.0
      sampling_function: generate_uniform
    Buntsandstein_bottom:
      value: -400.0
      value_min: -415.0
      value_max: -385.0
      sampling_function: generate_uniform
    Zechstein_bottom:
      value: -1000.0
      value_min: -1025.0
      value_max: -975.0
      sampling_function: generate_uniform
    Host_rock_bottom:
      value: -1175.0
      value_min: -1200.0
      value_max: -1150.0
      sampling_function: generate_uniform
    basement_bottom:
      value: -1800.0
      value_min: -1900.0
      value_max: -1700.0
      sampling_function: generate_uniform

communication_ntd:
  nuclide_to_consider:
    - I-129

uncertain_parameters:
  rock_data:
    Zechstein:
      - porosity
      - density
    Host_rock:
      - porosity
      - density
    basement:
      - porosity
      - density
  nuclide_water_diffusivity_data:
    Zechstein:
      - I-129
    Host_rock:
      - I-129
    basement:
      - I-129

sampling_config:
  training:
    sample_size: 4
    sampling_method: sobol
    seed: 21
  validation:
    sample_size: 4
    sampling_method: random
    seed: 21

model:
  create_python_bc: True
  python_bc_source_value: 0.0022
  source:
    type: point
    loc: -1087.5
  initial_condition_nuclide:
    type:
      - Constant
    value:
      - 0.0
  boundary_condition_nuclide:
    type:
      - Python
    mesh:
      - reactive_domain
    value:
      - bc_c
  pressure_setup:
    pressure_initial: 100000.0
    pressure_top: 100000.0
    pressure_bottom: 1000000.0
  decay: true
  diffusion: true
  advection: false
  sorption: true

simulator_config:
  n_jobs: 4
  parallel: True
  keep_vtu: False

surrogate:
  type: pce
  output_qoi: I-129Flux
  z_interest:
    - Host_rock_top
    - Host_rock_bottom
  t_interest: null
  qoi_floor: 1.0e-20
  transform: null
  pce_opts:
    q_norm: 0.6
    degree: [3, 4, 5]
