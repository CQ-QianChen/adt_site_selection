communication_sdh:
  site_name: DE_Rocksalt

  tag_dict:
    location:
      - Saxony-Anhalt

  # optional
  merge_unit_rock_prop:
    Quaternary: [Quaternary]
    Tertiary: [Tertiary]
    Buntsandstein: [Buntsandstein]
    Host_rock: [
        Aller,
        Leine_Anhydritmittelsalz,
        Leine_Potash,
        Leine_Rocksalt,
        Leine_Hauptanhydrit,
        Strassfurt_Potash,
        Strassfurt_Rocksalt,
        Stassfurt_Anhydrite_Carbonate,
    ]
    Rotliegend: [Rotliegend]
    basement: [Rotliegend]

  # optional
  merge_unit_depth:
    Quaternary_top:
      value: 0.0
      value_min: -10.0
      value_max: 10.0
      sampling_function: generate_uniform
    Quaternary_bottom:
      value: -50.0
      value_min: -60.0
      value_max: -40.0
      sampling_function: generate_uniform
    Tertiary_bottom:
      value: -220.0
      value_min: -245.0
      value_max: -195.0
      sampling_function: generate_uniform
    Buntsandstein_bottom:
      value: -1215.0
      value_min: -1240.0
      value_max: -1190.0
      sampling_function: generate_uniform
    Host_rock_bottom:
      value: -1390.0
      value_min: -1415.0
      value_max: -1365.0
      sampling_function: generate_uniform
    Rotliegend_bottom:
      value: -1500.0
      value_min: -1525.0
      value_max: -1475.0
      sampling_function: generate_uniform
    basement_bottom:
      value: -1800.0
      value_min: -1900.0
      value_max: -1700.0
      sampling_function: generate_uniform

communication_ntd:
  nuclide_to_consider:
    - I-129

uncertain_parameters:
  rock_data:
    Buntsandstein:
      - porosity
      - density
    Host_rock:
      - porosity
      - density
    Rotliegend:
      - porosity
      - density
  nuclide_water_diffusivity_data:
    Buntsandstein:
      - I-129
    Host_rock:
      - I-129
    Rotliegend:
      - I-129

sampling_config:
  training:
    sample_size: 4
    sampling_method: sobol
    seed: 21
  validation:
    sample_size: 4
    sampling_method: random
    seed: 21

model:
  create_python_bc: True
  python_bc_source_value: 0.0022
  source:
    type: point
    loc: -1302.5
  initial_condition_nuclide:
    type:
      - Constant
    value:
      - 0.0
  boundary_condition_nuclide:
    type:
      - Python
    mesh:
      - reactive_domain
    value:
      - bc_c
  pressure_setup:
    pressure_initial: 100000.0
    pressure_top: 100000.0
    pressure_bottom: 1000000.0
  decay: true
  diffusion: true
  advection: false
  sorption: true

simulator_config:
  n_jobs: 4
  parallel: True
  keep_vtu: False

surrogate:
  type: pce
  output_qoi: I-129Flux
  z_interest:
    - Host_rock_top
    - Host_rock_bottom
  t_interest: null
